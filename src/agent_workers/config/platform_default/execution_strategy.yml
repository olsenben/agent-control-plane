schema_version: execution_strategy.v1

default_engine: official_rlm
fallback_engine: minimal_local_rlm
test_engine: fake_rlm

external_agent_backends:
  mode: rlm_tool_only
  allowed: []

direct_backend_execution:
  allowed: false
  exception: platform_admin_spike_only

model_policy_map:
  fake: fake_rlm
  test: fake_rlm
  official: official_rlm
  balanced: minimal_local_rlm
  local: minimal_local_rlm
  readonly: minimal_local_rlm

read_only:
  max_prompt_chars: 12000
  max_context_files: 5
  rlms_max_iterations_cap: 3
  rlms_max_depth_cap: 0
