[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Reusable agentic SDLC platform: schemas, CLI, webhook guard, state reducer, queues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "redis>=5.0",
  "rq>=1.16",
  "jsonschema>=4.0",
  "GitPython>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
context = ["gitingest>=0"]
rlm = ["rlms>=0.1.2"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
agentctl = "agent_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
