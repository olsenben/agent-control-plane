[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Reusable agentic SDLC platform: schemas, CLI, webhook guard, state reducer, queues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "redis>=5.0",
  "rq>=1.16",
  "jsonschema>=4.0",
  "GitPython>=3.1",
  "python-multipart>=0.0.9",
  "networkx>=3.0",
  "tree-sitter>=0.22",
  "tree-sitter-python>=0.23",
  "jinja2>=3.1",
]

[project.optional-dependencies]
context = ["gitingest>=0"]
rlm = ["rlms>=0.1.2"]
dev = ["pytest>=8.0", "ruff==0.15.17", "mypy>=1.8"]
structured = ["instructor>=1.0", "openai>=1.0", "watchfiles>=0.21"]
observe = [
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]

[project.scripts]
agentctl = "agent_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "live_gitea_auth: exercise real check_user_repo_permission (no autouse allow mock)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# CT102 `pip install -e ".[dev]"` must not float to a newer ruff that enables
# rules this tree has never been cleaned against (412 failures on 0.16.x).
required-version = "==0.15.17"
