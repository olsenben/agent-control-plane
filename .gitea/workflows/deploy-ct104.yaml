name: deploy-ct104

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ct104
  cancel-in-progress: false

permissions: read-all

jobs:
  test:
    runs-on: docker-ci
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        run: .venv/bin/pytest -q
      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.ct104.yml config

  deploy:
    runs-on: deploy
    needs: test
    steps:
      - name: Deploy to CT104 via SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_CT104_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_CT104_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_CT104_USER }}
          DEPLOY_GIT_TOKEN: ${{ secrets.DEPLOY_GIT_TOKEN }}
          GIT_ORIGIN_URL: ${{ secrets.DEPLOY_GIT_ORIGIN_URL }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST:-}" || { echo "DEPLOY_CT104_HOST secret missing" >&2; exit 1; }
          test -n "${DEPLOY_USER:-}" || { echo "DEPLOY_CT104_USER secret missing" >&2; exit 1; }
          test -n "${DEPLOY_SSH_KEY:-}" || { echo "DEPLOY_CT104_SSH_KEY secret missing" >&2; exit 1; }
          test -n "${DEPLOY_GIT_TOKEN:-}" || { echo "DEPLOY_GIT_TOKEN secret missing" >&2; exit 1; }

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT

          GIT_TOKEN_ESC=$(printf '%s' "$DEPLOY_GIT_TOKEN" | sed "s/'/'\\\\''/g")
          GIT_ORIGIN_ESC=$(printf '%s' "${GIT_ORIGIN_URL:-http://192.168.4.60:3000/ai-sdlc-lab/agent-control-plane.git}" | sed "s/'/'\\\\''/g")

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<REMOTE
          set -euo pipefail
          export DEPLOY_GIT_TOKEN='${GIT_TOKEN_ESC}'
          export GIT_ORIGIN_URL='${GIT_ORIGIN_ESC}'
          cd /opt/ai-sdlc-lab/agent-control-plane
          if [ -f scripts/deploy-git-pull.sh ]; then
            bash scripts/deploy-git-pull.sh
          else
            echo "deploy-git-pull.sh missing — inline pull (bootstrap once, then script exists on next deploy)"
            git remote set-url origin "\$GIT_ORIGIN_URL"
            ASKPASS="\$(mktemp)"
            printf '%s\n' '#!/bin/sh' \
              'case "\$1" in' \
              '  *Username*) printf "%s\\n" "deploy" ;;' \
              '  *Password*) printf "%s\\n" "\$DEPLOY_GIT_TOKEN" ;;' \
              'esac' > "\$ASKPASS"
            chmod 700 "\$ASKPASS"
            export GIT_ASKPASS="\$ASKPASS" GIT_TERMINAL_PROMPT=0
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            rm -f "\$ASKPASS"
          fi
          test -f .env || { echo ".env missing on host; bootstrap manually on CT104" >&2; exit 1; }
          docker compose -f docker-compose.ct104.yml build worker-rlm-root worker-report
          docker compose -f docker-compose.ct104.yml up -d
          sleep 5
          for svc in worker-rlm-root worker-report; do
            if [ -z "\$(docker compose -f docker-compose.ct104.yml ps --status running -q "\$svc")" ]; then
              echo "\${svc} is not running after deploy" >&2
              docker compose -f docker-compose.ct104.yml ps "\$svc" >&2 || true
              docker compose -f docker-compose.ct104.yml logs --tail=80 "\$svc" >&2 || true
              exit 1
            fi
            echo "\${svc}: running"
          done
          docker compose -f docker-compose.ct104.yml exec -T worker-rlm-root agentctl worker doctor
          REMOTE
