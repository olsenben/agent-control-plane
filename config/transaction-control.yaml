transaction_control:
  enabled: false
  task_providers:
    - GITEA_ISSUE
    - SECURITY_FINDING_FIXTURE
  actor_provider_id: fixture_deterministic
  evidence_adapters:
    - P1
    - P2
    - P3
    - P4
    - P5
  auto_admit_policy_id: w5_evidence_policy.v1
  authoritative_verifier_id: ct102_functional_ci
  retry_policy:
    worker_dispatch:
      max_attempts: 3
      exhaustion_code: WORKER_DISPATCH_RETRY_EXHAUSTED
    evidence_adapters:
      max_attempts: 3
      exhaustion_code: EVIDENCE_ADAPTER_RETRY_EXHAUSTED
    gitea_reads:
      max_attempts: 5
      exhaustion_code: GITEA_READ_RETRY_EXHAUSTED
    gitea_publish:
      max_attempts: 2
      exhaustion_code: GITEA_PUBLISH_RETRY_EXHAUSTED
    ci_polling:
      max_attempts: 10
      exhaustion_code: CI_POLLING_RETRY_EXHAUSTED
  stuck_sla_seconds:
    PATCH_PROPOSED: 900
    EVIDENCE_PENDING: 900
    ESCALATED: 3600
    CAPABILITY_MINTED: 900
    PUBLISH_REQUESTED: 600
    VERIFICATION_PENDING: 1800
