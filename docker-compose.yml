# AgentControl + Redis (homelab). Start API + Redis only; enable workers later.
# See docs/deploy.md for DNS, NPM, and secrets.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Tailscale-only access for CT104; LAN blocked by scripts/ct103-ufw.sh
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  control-plane:
    build: .
    restart: unless-stopped
    ports:
      # LAN: NPM CT101 (optional) or Gitea CT100 -> CT103 192.168.4.62:8080
      - "8080:8080"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_STATE_ROOT: /data/agent-state
      AGENT_CACHE_DIR: /data/agent-cache
      GIT_TERMINAL_PROMPT: "0"
    volumes:
      - ${AGENT_STATE_HOST_PATH:-../agent-state}:/data/agent-state
      - ${AGENT_CACHE_HOST_PATH:-../agent-cache}:/data/agent-cache
      - ${GIT_CREDENTIALS_HOST_PATH:-/home/deploy/.git-credentials}:/root/.git-credentials:ro
      - ./config/git-worker.gitconfig:/root/.gitconfig:ro
    depends_on:
      redis:
        condition: service_healthy

  # Uncredentialed: state reduction + result ingest only (no Gitea write / git push).
  worker-state:
    profiles: [workers]
    build: .
    restart: unless-stopped
    command:
      [
        "agentctl",
        "worker",
        "run",
        "--queues",
        "state",
        "--queues",
        "results-ingest",
        "--concurrency",
        "1",
      ]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_STATE_ROOT: /data/agent-state
    volumes:
      - ${AGENT_STATE_HOST_PATH:-../agent-state}:/data/agent-state
    depends_on:
      redis:
        condition: service_healthy

  # Credentialed publish broker only (V4.1.1). Do not add other queues here.
  publish-broker:
    profiles: [workers]
    build: .
    restart: unless-stopped
    command:
      [
        "agentctl",
        "worker",
        "run",
        "--queues",
        "publish",
        "--concurrency",
        "1",
      ]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_STATE_ROOT: /data/agent-state
      AGENT_CACHE_DIR: /data/agent-cache
      GIT_TERMINAL_PROMPT: "0"
      FIX_REMOTE_PUBLISH_ENABLED: ${FIX_REMOTE_PUBLISH_ENABLED:-false}
    volumes:
      - ${AGENT_STATE_HOST_PATH:-../agent-state}:/data/agent-state
      - ${AGENT_CACHE_HOST_PATH:-../agent-cache}:/data/agent-cache
      - ${GIT_CREDENTIALS_HOST_PATH:-/home/deploy/.git-credentials}:/root/.git-credentials:ro
      - ./config/git-worker.gitconfig:/root/.gitconfig:ro
    depends_on:
      redis:
        condition: service_healthy

  worker-rlm-root:
    profiles: [workers-ct104]
    build: .
    restart: unless-stopped
    command:
      ["agentctl", "worker", "run", "--queues", "rlm-root", "--concurrency", "1"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_RUNS_DIR: /mnt/agent-runs
      AGENT_CACHE_DIR: /mnt/agent-cache
      AGENT_STATE_ROOT: /data/agent-state
    volumes:
      - ${AGENT_RUNS_HOST_PATH:-../agent-runs}:/mnt/agent-runs
      - ${AGENT_CACHE_HOST_PATH:-../agent-cache}:/mnt/agent-cache
      - ${AGENT_STATE_HOST_PATH:-../agent-state}:/data/agent-state
    depends_on:
      redis:
        condition: service_healthy

  worker-report:
    profiles: [workers-ct104]
    build: .
    restart: unless-stopped
    command:
      ["agentctl", "worker", "run", "--queues", "report", "--concurrency", "1"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_RUNS_DIR: /mnt/agent-runs
      AGENT_STATE_ROOT: /data/agent-state
    volumes:
      - ${AGENT_RUNS_HOST_PATH:-../agent-runs}:/mnt/agent-runs
      - ${AGENT_STATE_HOST_PATH:-../agent-state}:/data/agent-state
    depends_on:
      redis:
        condition: service_healthy

  # V6 T04 — optional LiteLLM Proxy (profile: model-gateway)
  # CT104 workers should set MODEL_GATEWAY_BASE_URL=http://litellm:4000/v1
  # and must not carry external provider API keys when this is enabled.
  litellm:
    profiles: [model-gateway]
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-homelab}
      OLLAMA_3080_URL: ${MODEL_3080_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_2070_URL: ${MODEL_2070_BASE_URL:-http://host.docker.internal:11435}
      BACKUP_API_BASE: ${MODEL_3080_FALLBACK_BASE_URL:-}
      BACKUP_API_KEY: ${MODEL_3080_FALLBACK_API_KEY:-}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
