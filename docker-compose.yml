# AgentControl + Redis (homelab). Start API + Redis only; enable workers later.
# See docs/deploy.md for DNS, NPM, and secrets.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Tailscale-only access for CT104; LAN blocked by scripts/ct103-ufw.sh
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  control-plane:
    build: .
    restart: unless-stopped
    ports:
      # LAN: NPM CT101 (optional) or Gitea CT100 -> CT103 192.168.4.62:8080
      - "8080:8080"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_STATE_ROOT: /data/agent-state
      AGENT_CACHE_DIR: /data/agent-cache
    volumes:
      - ${AGENT_STATE_HOST_PATH:-../agent-state}:/data/agent-state
      - ${AGENT_CACHE_HOST_PATH:-../agent-cache}:/data/agent-cache
    depends_on:
      redis:
        condition: service_healthy

  # Do not start until Gitea webhooks and secrets are configured (docs/deploy.md).
  worker-state:
    profiles: [workers]
    build: .
    restart: unless-stopped
    command:
      [
        "agentctl",
        "worker",
        "run",
        "--queues",
        "state",
        "--concurrency",
        "1",
      ]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ${AGENT_STATE_HOST_PATH:-../agent-state}:/data/agent-state
    depends_on:
      redis:
        condition: service_healthy

  worker-rlm-root:
    profiles: [workers-ct104]
    build: .
    restart: unless-stopped
    command:
      ["agentctl", "worker", "run", "--queues", "rlm-root", "--concurrency", "1"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_RUNS_DIR: /mnt/agent-runs
      AGENT_CACHE_DIR: /mnt/agent-cache
      AGENT_STATE_ROOT: /data/agent-state
    volumes:
      - ${AGENT_RUNS_HOST_PATH:-../agent-runs}:/mnt/agent-runs
      - ${AGENT_CACHE_HOST_PATH:-../agent-cache}:/mnt/agent-cache
      - ${AGENT_STATE_HOST_PATH:-../agent-state}:/data/agent-state
    depends_on:
      redis:
        condition: service_healthy

  worker-report:
    profiles: [workers-ct104]
    build: .
    restart: unless-stopped
    command:
      ["agentctl", "worker", "run", "--queues", "report", "--concurrency", "1"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_RUNS_DIR: /mnt/agent-runs
      AGENT_STATE_ROOT: /data/agent-state
    volumes:
      - ${AGENT_RUNS_HOST_PATH:-../agent-runs}:/mnt/agent-runs
      - ${AGENT_STATE_HOST_PATH:-../agent-state}:/data/agent-state
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
