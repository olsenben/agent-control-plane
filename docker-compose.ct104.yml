# CT104 worker host only (steelleg). Redis and control-plane live on CT103.
# Usage: docker compose -f docker-compose.ct104.yml up -d --build
# Requires REDIS_URL in .env pointing at CT103 Tailscale IP (see docs/ct104.md).
#
# WORKER_DURABLE_CREDENTIALS_PRESENT=NO: fail-closed product assertion.
# env_file .env is loaded first; null entries below unset CT103 durable
# tokens so a copied control-plane .env cannot inject them.
# git-credentials mounts are clone-only HTTPS helpers, not GITEA_BOT_TOKEN.

x-ct104-fail-closed-env: &ct104-fail-closed-env
  WORKER_DURABLE_CREDENTIALS_PRESENT: "NO"
  GITEA_BOT_TOKEN: null
  GITEA_AGENT_TOKEN: null
  GITEA_WEBHOOK_SECRET: null
  AGENTFACTS_SIGNING_SECRET: null
  OBSERVE_SHARED_TOKEN: null
  OBSERVE_OAUTH_CLIENT_SECRET: null
  BROKER_SIGNING_SECRET: null
  DURABLE_CAPABILITY_SIGNING_SECRET: null
  DEPLOY_SSH_KEY: null
  DEPLOY_CT104_SSH_KEY: null
  CT104_ALLOW_WRITE_TOKEN_DEBT: null

services:
  worker-rlm-root:
    build: .
    restart: unless-stopped
    # bwrap inside Docker-on-unprivileged-LXC (Risk 2 / SRT)
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    command:
      ["agentctl", "worker", "run", "--queues", "rlm-root", "--concurrency", "1"]
    env_file:
      - .env
    environment:
      <<: *ct104-fail-closed-env
      REDIS_URL: ${REDIS_URL}
      AGENT_RUNS_DIR: /mnt/agent-runs
      AGENT_CACHE_DIR: /mnt/agent-cache
      AGENT_STATE_ROOT: /data/agent-state
      GIT_TERMINAL_PROMPT: "0"
      # SHA-256 of known write PATs; required when git-credentials is mounted.
      CT104_FORBIDDEN_GIT_TOKEN_SHA256: ${CT104_FORBIDDEN_GIT_TOKEN_SHA256:-}
      # CT103-only gate; force off so a copied CT103 .env cannot crash workers
      FIX_CI_REPAIR_ENABLED: "false"
    volumes:
      - ${AGENT_RUNS_HOST_PATH:-/mnt/agent-runs}:/mnt/agent-runs
      - ${AGENT_CACHE_HOST_PATH:-/mnt/agent-cache}:/mnt/agent-cache
      - ${AGENT_STATE_HOST_PATH:-/mnt/agent-state}:/data/agent-state
      # Inspected clone helper; must not contain a write PAT. Env write tokens stay forbidden.
      - ${GIT_CREDENTIALS_HOST_PATH:-/home/deploy/.git-credentials}:/root/.git-credentials:ro
      - ./config/git-worker.gitconfig:/root/.gitconfig:ro

  worker-report:
    build: .
    restart: unless-stopped
    command:
      ["agentctl", "worker", "run", "--queues", "report", "--concurrency", "1"]
    env_file:
      - .env
    environment:
      <<: *ct104-fail-closed-env
      REDIS_URL: ${REDIS_URL}
      AGENT_RUNS_DIR: /mnt/agent-runs
      AGENT_STATE_ROOT: /data/agent-state
      # CT103-only gate; force off so a copied CT103 .env cannot crash workers
      FIX_CI_REPAIR_ENABLED: "false"
    volumes:
      - ${AGENT_RUNS_HOST_PATH:-/mnt/agent-runs}:/mnt/agent-runs
      - ${AGENT_STATE_HOST_PATH:-/mnt/agent-state}:/data/agent-state

  worker-ci-repair:
    build: .
    restart: unless-stopped
    # bwrap --unshare-net inside Docker-on-unprivileged-LXC needs these
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    command:
      ["agentctl", "worker", "run", "--queues", "ci-repair", "--concurrency", "1"]
    env_file:
      - .env
    environment:
      <<: *ct104-fail-closed-env
      REDIS_URL: ${REDIS_URL}
      AGENT_RUNS_DIR: /mnt/agent-runs
      AGENT_CACHE_DIR: /mnt/agent-cache
      AGENT_STATE_ROOT: /data/agent-state
      GIT_TERMINAL_PROMPT: "0"
      CT104_FORBIDDEN_GIT_TOKEN_SHA256: ${CT104_FORBIDDEN_GIT_TOKEN_SHA256:-}
      # Dispatch gate lives on CT103; worker only executes enqueued repair jobs
      FIX_CI_REPAIR_ENABLED: "false"
      FIX_REMOTE_PUBLISH_ENABLED: "false"
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-srt}
      SANDBOX_EXPECTED_POLICY_HASH: ${SANDBOX_EXPECTED_POLICY_HASH:-}
      SANDBOX_REQUIRE_ATTESTATION: ${SANDBOX_REQUIRE_ATTESTATION:-true}
    volumes:
      - ${AGENT_RUNS_HOST_PATH:-/mnt/agent-runs}:/mnt/agent-runs
      - ${AGENT_CACHE_HOST_PATH:-/mnt/agent-cache}:/mnt/agent-cache
      - ${AGENT_STATE_HOST_PATH:-/mnt/agent-state}:/data/agent-state
      # Inspected clone helper; must not contain a write PAT. Env write tokens stay forbidden.
      - ${GIT_CREDENTIALS_HOST_PATH:-/home/deploy/.git-credentials}:/root/.git-credentials:ro
      - ./config/git-worker.gitconfig:/root/.gitconfig:ro
